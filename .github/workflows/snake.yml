name: 🌌 Generate Cosmic Snake & Telemetry

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
      - .github/scripts/**

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Cosmic Snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (for the stats script)
        uses: actions/checkout@v4
        with:
          path: src

      - name: Generate cosmic telemetry card
        continue-on-error: true # never block the snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 src/.github/scripts/cosmic_stats.py "${{ github.repository_owner }}" dist/cosmic-stats.svg

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffd166&color_dots=#161b22,#2d1b4e,#5b2a86,#9d4edd,#e0aaff&color_background=#0d1117
            dist/github-snake.svg?palette=github-light&color_snake=#5b2a86&color_dots=#ebedf0,#e0aaff,#c77dff,#9d4edd,#5b2a86

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🌌 Update cosmic snake & telemetry"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
